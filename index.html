<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C3E50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>工程報價單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* 中性高級感：深灰藍 / 石墨灰 + 低飽和琥珀金 / 奶油白 */
  --primary:#2C3E50; --primary-2:#34495E; --primary-3:#4A6075; --primary-dk:#22313F;
  --amber:#C8A46E; --amber-hi:#D9BC8C; --amber-deep:#A8854F; --amber-ink:#7E6234;
  --cream:#F7F2E8; --cream-2:#FBF8F2;
  --bg:#F8F9FA; --card:#FFFFFF; --ink:#2C3E50; --ink-2:#56677A; --muted:#8695A3;
  --line:#E3E7EB; --line-2:#D5DCE2; --pale:#EEF1F4;
  --green:#3E8E6A; --green-pale:#E8F3EE; --red:#B85450; --red-pale:#F8EAEA; --blue:#4A7397; --blue-pale:#EAF0F6;
  --radius:16px; --shadow:0 1px 2px rgba(44,62,80,.04),0 6px 18px rgba(44,62,80,.06);
  --tap:54px;
  --font:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color-scheme:light;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;min-height:100vh;overscroll-behavior-y:none;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
#view{padding-bottom:calc(116px + env(safe-area-inset-bottom))}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--primary);color:#fff}
.topbar::after{content:"";display:block;height:2px;background:var(--amber);opacity:.85}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.topbar h1{font-size:18px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.topbar .sub{display:block;font-size:12px;font-weight:400;color:#AEBBC7;letter-spacing:.08em}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;height:46px;border-radius:12px;color:#fff;padding:0 10px;font-weight:600;font-size:16px}
.tb-btn:active{background:rgba(255,255,255,.1)}
.tb-btn.ghost{border:1px solid rgba(255,255,255,.25)}
.brand-logo{width:40px;height:40px;border-radius:11px;background:var(--primary-2);border:1px solid rgba(200,164,110,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#fff}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 20px;border-radius:14px;font-weight:600;font-size:17px;letter-spacing:.03em;transition:transform .06s,filter .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--amber);color:var(--primary-dk);box-shadow:0 4px 14px rgba(168,133,79,.28)}
.btn-primary:active{filter:brightness(.95)}
.btn-dark{background:var(--primary-2);color:#fff}
.btn-line{background:#06C755;color:#fff;box-shadow:0 4px 14px rgba(6,199,85,.25)}
.btn-outline{background:#fff;border:1.5px solid var(--line-2);color:var(--ink)}
.btn-danger{background:var(--red-pale);color:var(--red)}
.btn-block{width:100%}
.btn-sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:11px}
.hero-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;min-height:74px;margin:18px 0 6px;border-radius:18px;background:linear-gradient(135deg,#D4B482,#BF9A62);color:var(--primary-dk);font-size:21px;font-weight:700;letter-spacing:.1em;box-shadow:0 8px 22px rgba(168,133,79,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.hero-btn:active{transform:translateY(2px);box-shadow:0 3px 10px rgba(168,133,79,.3)}
.hero-btn svg.i{width:26px;height:26px;stroke-width:2.4}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.kpi{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:14px 16px 13px;text-align:left;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.kpi .lab::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.kpi.k2 .lab::before{background:var(--blue)} .kpi.k4 .lab::before{background:var(--green)}
.kpi .num{font-size:23px;font-weight:700;line-height:1.3;margin-top:4px;word-break:break-all;letter-spacing:.01em}
.kpi .cnt{font-size:12.5px;color:var(--muted)}
.kpi.k3{background:var(--primary);border-color:var(--primary);color:#fff}
.kpi.k3 .lab,.kpi.k3 .cnt{color:#AEBBC7} .kpi.k3 .lab::before{background:var(--amber)}
.kpi.k3 .num{color:#fff}
.kpi.on{outline:2px solid var(--amber);outline-offset:2px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}

/* ---------- Search / chips ---------- */
.search{position:relative;margin:6px 0 10px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:var(--tap);border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px 0 46px;font-size:17px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(200,164,110,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:15px;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.accent.on{background:var(--cream);border-color:var(--amber);color:var(--primary-2)}

/* ---------- Quote card ---------- */
.qcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
.qcard .main{padding:16px 18px 12px;display:block;width:100%;text-align:left}
.qc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qno{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.qc-name{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:.02em}
.qc-name small{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.qc-addr{display:flex;align-items:flex-start;gap:4px;color:var(--ink-2);font-size:15px;margin-top:4px}
.qc-addr svg.i{width:17px;height:17px;margin-top:3px;color:var(--muted)}
.qc-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.qc-date{font-size:14px;color:var(--muted)}
.qc-total{font-size:24px;font-weight:700;color:var(--primary);letter-spacing:.01em}
.qc-actions{display:flex;border-top:1px solid var(--line);background:var(--cream-2)}
.qc-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;font-weight:600;font-size:15px;color:var(--ink-2)}
.qc-actions button+button{border-left:1px solid var(--line)}
.qc-actions button:active{background:var(--pale)}
.qc-actions .pri{color:var(--primary-2)}
.recv{color:var(--primary-2);font-weight:600}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;letter-spacing:.04em}
.s-draft{background:var(--pale);color:var(--ink-2)}
.s-sent{background:var(--blue-pale);color:var(--blue)}
.s-signed{background:var(--cream);color:var(--primary-2)}
.s-deposit{background:#F3EBDA;color:var(--primary-2)}
.s-mid{background:#EFE3CF;color:var(--primary-2)}
.s-done{background:var(--green-pale);color:var(--green)}
.s-lost{background:var(--red-pale);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;font-size:18px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.banner{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--amber);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:15px;color:var(--primary-2)}
.banner button{margin-left:auto;font-weight:700;color:var(--primary);white-space:nowrap;min-height:40px}
.sec-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink-2);margin:20px 0 8px;letter-spacing:.12em}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(44,62,80,.06)}
.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.04em;position:relative}
.bnav button.on{color:var(--primary)}
.bnav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
.bnav svg.i{width:24px;height:24px}

/* ---------- Editor ---------- */
.steps{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:15;background:rgba(248,249,250,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.steps .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px}
.step{flex:1;min-height:50px;border-radius:12px;color:var(--muted);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.15;text-align:center;background:#fff;border:1px solid var(--line)}
.step{position:relative;white-space:nowrap}
.step #itemCnt:not(:empty){position:absolute;top:-7px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--amber);color:var(--primary-dk);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(168,133,79,.35)}
.step .n{width:23px;height:23px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(44,62,80,.2)}
.step.on .n{background:var(--amber);color:var(--primary-dk);border-color:var(--amber)}
.pane{display:none;padding-top:14px}
.pane.on{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;border:1px solid var(--line)}
.card h3{margin:0 0 14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;letter-spacing:.06em}
.card h3 .bar{width:4px;height:18px;background:var(--amber);border-radius:2px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld>label,.lbl{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px;letter-spacing:.04em}
.fld .req{color:var(--ink-2)}
.inp{width:100%;min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line-2);background:#fff;padding:10px 14px;font-size:18px;font-weight:500;color:var(--ink)}
.inp::placeholder{color:#AAB5C0;font-weight:400}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(200,164,110,.18)}
.inp[readonly]{background:var(--pale);color:var(--ink-2)}
textarea.inp{min-height:150px;line-height:1.7;font-size:16px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.fld>label.mat{display:flex;margin:0;font-size:15px;color:inherit}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.warn{background:var(--red-pale);color:var(--red);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;margin-top:10px}
.nextbar{display:flex;gap:10px;margin:6px 0 20px}
.nextbar .btn{flex:1}

.item{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.item.flash{animation:flash 1.1s}
@keyframes flash{0%{border-color:var(--amber);background:var(--cream)}100%{border-color:var(--line);background:#fff}}
.it-head{display:flex;gap:8px;align-items:flex-start}
.it-no{flex:none;width:30px;height:30px;border-radius:9px;background:var(--cream);color:var(--primary-2);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:12px}
.it-head .inp{font-weight:600}
.icon-btn{flex:none;width:48px;height:var(--tap);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:active{background:var(--pale)}
.icon-btn.del{color:#C08A87}
.it-grid{display:grid;grid-template-columns:1.35fr .75fr 1fr;gap:8px;margin-top:10px}
.it-grid>div{min-width:0}
.it-grid .lbl{font-size:12.5px;margin-bottom:3px;color:var(--muted)}
.stepper{display:flex;align-items:stretch;border:1.5px solid var(--line-2);border-radius:12px;overflow:hidden;height:var(--tap);background:#fff}
.stepper button{width:40px;font-size:22px;font-weight:500;color:var(--primary-3);background:var(--pale);flex:none}
.stepper button:active{background:var(--line-2)}
.stepper input{flex:1;min-width:0;border:0;text-align:center;font-size:20px;font-weight:700;padding:0;background:#fff;color:var(--primary)}
.stepper input:focus{outline:none;background:var(--cream)}
.it-grid .inp{padding:8px 10px;font-size:17px}
.it-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.it-sub{font-size:12.5px;color:var(--muted);text-align:right;margin-left:auto;letter-spacing:.06em}
.it-sub b{display:block;font-size:22px;color:var(--primary);font-weight:700;line-height:1.2;letter-spacing:.01em}
.mini-link{font-size:14px;font-weight:600;color:var(--ink-2);min-height:40px;padding:0 4px}

/* switch */
.mat{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:4px 14px 4px 6px;border-radius:999px;border:1.5px solid var(--line-2);font-weight:600;font-size:15px;user-select:none;cursor:pointer;background:#fff}
.mat input{display:none}
.mat .tg{width:44px;height:26px;border-radius:999px;background:#C9D2DA;position:relative;transition:.15s;flex:none}
.mat .tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mat input:checked+.tg{background:var(--amber)}
.mat input:checked+.tg::after{left:21px}
.mat .on-t{display:none;color:var(--primary-2)} .mat .off-t{color:var(--ink-2)}
.mat input:checked~.on-t{display:inline} .mat input:checked~.off-t{display:none}
.mat:has(input:checked){border-color:var(--amber);background:var(--cream)}

.add-row{display:grid;grid-template-columns:1fr;gap:10px;margin:4px 0 16px}
.add-big{min-height:64px;font-size:18px;border:1.5px dashed var(--amber);background:var(--cream-2);color:var(--primary-2);border-radius:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.06em}

.pay-row{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pay-row:last-of-type{border-bottom:0}
.pay-row .pn{font-weight:600;color:var(--ink-2)}
.pct{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:12px;height:var(--tap);overflow:hidden;background:#fff;max-width:130px}
.pct input{width:100%;min-width:0;border:0;text-align:center;font-size:20px;font-weight:700;background:transparent;color:var(--primary)}
.pct input:focus{outline:none}
.pct span{padding:0 12px;color:var(--muted);font-weight:600;background:var(--pale);align-self:stretch;display:flex;align-items:center}
.pay-amt{font-size:20px;font-weight:700;text-align:right;min-width:96px;color:var(--primary)}
.pay-sum{display:flex;justify-content:space-between;font-weight:600;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.pay-sum span span{color:var(--primary)}

/* bottom total bar */
.totalbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--primary);color:#fff;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(44,62,80,.18)}
.totalbar .wrap{display:flex;align-items:center;gap:12px;min-height:84px}
.tb-total{flex:1;min-width:0}
.tb-total small{display:block;color:#AEBBC7;font-size:13px;letter-spacing:.1em}
.tb-total b{display:block;font-size:29px;font-weight:700;color:#fff;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.totalbar .btn{min-height:58px;font-size:17px;padding:0 18px}

/* ---------- Preview ---------- */
.pv-status{display:flex;align-items:center;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
.pv-status .lbl{margin:0}
.pv-total{margin-left:auto;font-weight:700;font-size:21px;color:var(--primary)}
.paper-wrap{overflow:hidden;margin:0 auto 16px;border-radius:6px;box-shadow:0 2px 6px rgba(44,62,80,.06),0 14px 34px rgba(44,62,80,.12)}
.paper-scale{transform-origin:top left;width:794px}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--primary);padding:10px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(44,62,80,.18)}
.actbar .wrap{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.actbar .btn{min-height:62px;flex-direction:column;gap:2px;font-size:14.5px;padding:0 6px}
.actbar .btn-dark{background:var(--primary-2);border:1px solid rgba(255,255,255,.1)}
.actbar .btn svg.i{width:23px;height:23px}

/* ---------- A4 Paper (fixed px for export) ---------- */
.paper{width:794px;min-height:1123px;background:#fff;color:#2C3E50;padding:0 56px 0;font-size:13px;line-height:1.6;position:relative;font-family:"Inter","Noto Sans TC","PingFang TC",sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.paper *{box-sizing:border-box}
.pp-lines{margin:0 -56px}
.pp-lines i{display:block;height:7px;background:#2C3E50}
.pp-lines b{display:block;height:2px;background:#C8A46E;margin-top:3px}
.pp-lines.end{margin-top:auto}
.pp-lines.end b{margin:0 0 3px}
.pp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:34px 0 22px;border-bottom:1px solid #E3E7EB}
.pp-co{display:flex;gap:14px;align-items:center;min-width:0}
.pp-logo{width:58px;height:58px;border-radius:12px;background:#2C3E50;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;flex:none;overflow:hidden}
.pp-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.pp-coname{font-size:21px;font-weight:700;letter-spacing:.08em;color:#2C3E50;line-height:1.35}
.pp-coinfo{font-size:11.5px;color:#6B7C8D;line-height:1.7;margin-top:2px}
.pp-title{text-align:right;flex:none}
.pp-title .t2{font-size:10.5px;font-weight:600;letter-spacing:.42em;color:#5E7387;margin-right:-.42em}
.pp-title .t1{font-size:27px;font-weight:700;color:#2C3E50;letter-spacing:.22em;line-height:1.3;margin-right:-.22em}
.pp-title .t3{font-size:11.5px;color:#6B7C8D;margin-top:2px;letter-spacing:.04em}
.pp-meta{display:grid;grid-template-columns:1.35fr 1fr;gap:36px;padding:22px 0 4px}
.pp-lab{font-size:10px;font-weight:600;letter-spacing:.22em;color:#5E7387;margin-bottom:6px}
.pp-client{font-size:19px;font-weight:700;color:#2C3E50;line-height:1.35;margin-bottom:4px}
.pp-kv{display:flex;gap:10px;padding:2px 0}
.pp-kv .k{flex:none;width:62px;color:#8695A3;font-size:12px}
.pp-kv .v{font-weight:500;color:#2C3E50;word-break:break-all}
.pp-meta .col+.col{border-left:1px solid #E3E7EB;padding-left:28px}
.pp-sec{margin-top:26px}
.pp-sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pp-sec-t .zh{font-size:14px;font-weight:700;color:#2C3E50;letter-spacing:.1em}
.pp-sec-t .en{font-size:9.5px;font-weight:600;color:#5E7387;letter-spacing:.24em}
.pp-sec-t::after{content:"";flex:1;height:1px;background:#E3E7EB;align-self:center}
.pp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.pp-tbl th{font-size:10.5px;font-weight:600;color:#6B7C8D;letter-spacing:.1em;padding:0 8px 9px;text-align:center;white-space:nowrap;border-bottom:1.5px solid #2C3E50}
.pp-tbl td{padding:11px 8px;border-bottom:1px solid #EAEDF0;vertical-align:middle;color:#34495E}
.pp-tbl .c{text-align:center} .pp-tbl .r{text-align:right;white-space:nowrap}
.pp-tbl .nm{font-weight:600;color:#2C3E50}
.pp-tbl .idx{color:#A3AFBA;font-size:11.5px}
.tag-m{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;background:#F5EEDF;color:#2C3E50;white-space:nowrap;letter-spacing:.04em}
.tag-l{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;background:#EEF1F4;color:#6B7C8D;white-space:nowrap;letter-spacing:.04em}
.pp-sum{display:flex;justify-content:space-between;gap:24px;margin-top:14px;align-items:flex-start}
.pp-legend{font-size:11px;color:#8695A3;padding-top:6px;line-height:2}
.pp-totals{width:300px;flex:none}
.pp-totals .ln{display:flex;justify-content:space-between;padding:3px 2px;color:#6B7C8D;font-size:12.5px}
.pp-totals .ln span:last-child{color:#2C3E50;font-weight:500}
.pp-totals .grand{display:flex;justify-content:space-between;align-items:center;background:#F7F2E8;border-top:2px solid #C8A46E;padding:12px 16px;margin-top:8px}
.pp-totals .grand span{font-size:11px;font-weight:600;letter-spacing:.14em;color:#2C3E50}
.pp-totals .grand b{font-size:25px;color:#2C3E50;font-weight:700;letter-spacing:.01em}
.pp-totals .cn{text-align:right;font-size:11px;color:#6B7C8D;margin-top:6px;letter-spacing:.06em}
.pp-pay{display:grid;gap:12px}
.pp-pay .pc{border:1px solid #E3E7EB;border-radius:8px;padding:12px 16px;position:relative;overflow:hidden}
.pp-pay .pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#C8A46E}
.pp-pay .pn{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:#34495E}
.pp-pay .pn em{font-style:normal;font-size:13px;font-weight:700;color:#5E7387}
.pp-pay .pa{font-size:20px;font-weight:700;color:#2C3E50;margin-top:2px}
.pp-pay .pw{font-size:11px;color:#8695A3}
.pp-facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #E3E7EB;border-bottom:1px solid #E3E7EB;margin-top:12px}
.pp-facts>div{padding:10px 16px}
.pp-facts>div+div{border-left:1px solid #E3E7EB}
.pp-facts .k{font-size:10.5px;color:#8695A3;letter-spacing:.1em}
.pp-facts .v{font-size:13.5px;font-weight:600;color:#2C3E50}
.pp-terms{margin:0;padding-left:18px;font-size:11.5px;color:#4E5F70;line-height:1.75}
.pp-bank{display:flex;flex-wrap:wrap;gap:4px 28px;background:#FBF8F2;border-left:3px solid #C8A46E;padding:11px 16px;font-size:12.5px;color:#6B7C8D}
.pp-bank b{color:#2C3E50;font-weight:600}
.pp-sign{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:30px;padding-bottom:28px}
.pp-sign .st{font-size:10px;font-weight:600;letter-spacing:.22em;color:#5E7387}
.pp-sign .sub{font-size:11px;color:#8695A3}
.pp-sign .area{height:58px;border-bottom:1px solid #2C3E50;display:flex;align-items:flex-end;justify-content:flex-end;padding-bottom:6px;font-size:14px;font-weight:600;color:#2C3E50;letter-spacing:.06em}
.pp-sign .dt{font-size:11px;color:#8695A3;margin-top:6px}
.pp-foot{text-align:center;font-size:10.5px;color:#8695A3;letter-spacing:.14em;padding:12px 0 14px}

/* ---------- 案件頁 ---------- */
.case-meta{display:grid;gap:4px;margin-top:10px;color:var(--ink-2);font-size:15px}
.case-meta .row{display:flex;align-items:center;gap:6px}
.case-meta .row span{min-width:0}
.case-meta svg.i{width:17px;height:17px;color:var(--muted)}
.case-meta .mini-link{min-height:34px}
.case-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.case-acts .btn{padding:0 10px;font-size:15.5px}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.money3>div{background:var(--pale);border-radius:12px;padding:10px 12px;min-width:0}
.money3 small{display:block;font-size:12.5px;color:var(--muted)}
.money3 b{display:block;font-size:18px;font-weight:700;color:var(--primary);word-break:break-all;line-height:1.3}
.money3 b.ok{color:var(--green)} .money3 b.due{color:var(--red)}
.money3 em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--pale);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px}
.stage{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.stage.od{border-color:#E3B5B2;background:#FDF7F6}
.st-top{display:flex;align-items:baseline;gap:8px}
.st-top b{font-size:17px}
.st-top .st-amt{margin-left:auto;font-size:19px;font-weight:700;color:var(--primary)}
.st-mid{font-size:14px;color:var(--ink-2);margin:4px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st-mid b{color:var(--red)}
.okt{color:var(--green);font-weight:600}
.od-tag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:0 9px;font-size:12px;font-weight:600;line-height:20px}
.st-bot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st-bot .btn{flex:1 1 0}
.due{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1 1 100%}
.inp-sm{min-height:42px;border-radius:10px;border:1.5px solid var(--line-2);padding:4px 10px;font-size:16px;background:#fff;color:var(--ink);flex:1;min-width:0;font-family:inherit}
.inp-sm:focus{outline:none;border-color:var(--amber)}
.rec{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.rec .t{flex:1;min-width:0}
.rec .t b{font-size:17px;color:var(--primary)}
.rec .t span{font-size:13.5px;color:var(--ink-2);margin-left:6px}
.rec .t small{display:block;font-size:12.5px;color:var(--muted)}
.rec .icon-btn{width:42px;height:42px}
.vrow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.vrow .top{display:flex;gap:10px;align-items:flex-start}
.vrow .top .t{flex:1;min-width:0}
.vrow .top small{display:block;color:var(--muted);font-size:12.5px}
.vrow .top .r{text-align:right}
.vrow .top .r b{display:block;font-size:18px;color:var(--primary)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{flex:1 1 auto;padding:0 10px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px;gap:10px}
.kv b{font-weight:600;color:var(--primary)}
.kv.big{border-bottom:0}
.kv.big b{font-size:24px;font-weight:700}
.kv .inp-sm{max-width:140px;text-align:right;flex:none}
.it-cost{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.it-cost input{width:110px;min-height:40px;border-radius:10px;border:1.5px solid var(--line-2);padding:4px 10px;font-size:16px;color:var(--ink);font-family:inherit}
.it-cost input:focus{outline:none;border-color:var(--amber)}
.sug{display:grid;gap:6px;margin-top:6px}
.sug:empty{display:none}
.sug button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--cream-2);border:1px solid var(--amber);border-radius:12px;padding:8px 12px;font-size:16px;font-weight:600}
.sug button small{color:var(--muted);font-size:12.5px;font-weight:400}

/* ---------- 排程 ---------- */
.day-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;color:var(--ink-2);font-size:15px}
.day-h .today{background:var(--primary);color:#fff;border-radius:999px;padding:0 10px;font-size:12.5px;line-height:22px}
.day-h .today.tm{background:var(--pale);color:var(--ink-2)}
.day-h button{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--ink-2);font-weight:600;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
.day-h button svg.i{width:16px;height:16px}
.job{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px;box-shadow:var(--shadow);align-items:center}
.job.done{opacity:.55}
.job .bd{flex:1;min-width:0;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:2px 0}
.job .tm{font-size:17px;font-weight:700;color:var(--primary);min-width:48px}
.job .tx{flex:1;min-width:0}
.job .tx b{display:block;font-size:16.5px;line-height:1.35}
.job .tx small{display:block;font-size:13.5px;color:var(--ink-2)}
.crew{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.crew span{background:var(--cream);color:var(--primary-2);border-radius:999px;padding:0 9px;font-size:12.5px;font-weight:600;line-height:22px}
.chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--line-2);flex:none;background:#fff}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.today-strip{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-top:12px;box-shadow:var(--shadow)}
.today-strip .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;color:var(--ink-2);margin-bottom:4px}
.today-strip .h span{display:inline-flex;align-items:center;gap:6px}
.today-strip .h svg.i{width:18px;height:18px}
.today-strip .l{font-size:14.5px;color:var(--ink);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-strip .l.dn{color:var(--muted);text-decoration:line-through}
.banner.red{background:var(--red-pale);border-color:#E3B5B2;color:var(--red)}
.banner.red button{color:var(--red)}

/* ---------- 叫料 ---------- */
.mrow{display:grid;grid-template-columns:76px 70px 1fr auto;gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .mname{grid-column:1/-1;font-weight:600}
.mrow input{min-height:44px;border-radius:10px;border:1.5px solid var(--line-2);padding:4px 10px;font-size:16px;min-width:0;width:100%;color:var(--ink);font-family:inherit;background:#fff}
.mrow input:focus{outline:none;border-color:var(--amber)}
.mrow .mst{justify-self:end}
.mst{min-height:40px;padding:0 12px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
.mst.ordered{background:var(--blue-pale);color:var(--blue);border-color:transparent}
.mst.arrived{background:var(--green-pale);color:var(--green);border-color:transparent}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .t{flex:1;min-width:0;font-size:15px;font-weight:600}
.arow .t small{color:var(--muted);display:block;font-size:12.5px;font-weight:400}

/* ---------- 單據 A4 ---------- */
.pp-due{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#F7F2E8;border-top:2px solid #C8A46E;padding:16px 20px}
.pp-due .k{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:#2C3E50}
.pp-due .cn{font-size:11.5px;color:#6B7C8D;margin-top:4px;letter-spacing:.06em}
.pp-due b{font-size:30px;font-weight:700;color:#2C3E50;white-space:nowrap}
.pp-note{font-size:11.5px;color:#6B7C8D;margin-top:8px}
.pp-sumtbl td{padding:9px 8px}
.pp-sumtbl tr.tot td{font-weight:700;color:#2C3E50;border-top:1.5px solid #2C3E50;border-bottom:0}
.pp-rcpt{font-size:15px;line-height:2.1;color:#2C3E50;padding:2px 0 12px}
.pp-rcpt b{font-size:19px;border-bottom:1px solid #2C3E50;padding:0 10px}
.pp-st{display:inline-block;padding:1px 9px;border-radius:999px;font-size:10.5px;font-weight:600}
.pp-st.ok{background:#E8F3EE;color:#3E8E6A} .pp-st.now{background:#F5EEDF;color:#2C3E50} .pp-st.wait{background:#EEF1F4;color:#6B7C8D}

/* ---------- Bottom sheet ---------- */
.bs-bg{position:fixed;inset:0;background:rgba(34,49,63,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.bs-bg.on{display:flex}
.bs{background:var(--bg);width:100%;max-width:760px;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.bs-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 20px;background:var(--primary);color:#fff;border-bottom:2px solid var(--amber)}
.bs-head b{flex:1;font-size:18px;font-weight:600;letter-spacing:.06em}
.bs-body{overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:64px;box-shadow:0 1px 2px rgba(44,62,80,.04)}
.pick:active{border-color:var(--amber);background:var(--cream)}
.pick .nm{flex:1;font-weight:600;font-size:16.5px;line-height:1.35}
.pick .nm small{display:inline-block;margin-top:3px}
.pick .pr{font-weight:700;font-size:18px;white-space:nowrap;text-align:right;color:var(--primary)}
.pick .pr small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.pick .plus{width:36px;height:36px;border-radius:11px;background:var(--amber);color:var(--primary-dk);display:flex;align-items:center;justify-content:center;flex:none}
.cat-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px;letter-spacing:.16em}
.cat-h::after{content:"";flex:1;height:1px;background:var(--line)}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;background:#fff;border-radius:14px;margin-bottom:8px;font-weight:600;font-size:16px;border:1px solid var(--line);text-align:left}
.menu-btn:active{background:var(--pale)}
.menu-btn.cur{border-color:var(--amber);background:var(--cream)}
.menu-btn.danger{color:var(--red)}
.ltag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.04em}
.ltag.m{background:var(--cream);color:var(--primary-2)}
.ltag.l{background:var(--pale);color:var(--ink-2)}

/* ---------- Library / Settings ---------- */
.lib-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;min-height:64px;box-shadow:var(--shadow)}
.lib-item .nm{flex:1;font-weight:600;line-height:1.35}
.lib-item .nm small{display:inline-block;margin-top:3px}
.lib-item .pr{font-weight:700;font-size:18px;white-space:nowrap;color:var(--primary)}
.lib-item .pr small{font-size:12.5px;font-weight:400;color:var(--muted)}
.logo-row{display:flex;align-items:center;gap:14px}
.logo-prev{width:84px;height:84px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;overflow:hidden;flex:none;border:1px solid var(--line)}
.logo-prev img{width:100%;height:100%;object-fit:contain;background:#fff}
.btn-col{display:flex;flex-direction:column;gap:8px;flex:1}
.stat-line{font-size:14px;color:var(--muted);margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--primary-dk);color:#fff;padding:12px 20px;border-radius:14px;font-weight:500;font-size:15.5px;z-index:200;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;box-shadow:0 10px 28px rgba(34,49,63,.3);border-left:3px solid var(--amber)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{position:fixed;inset:0;background:rgba(34,49,63,.6);z-index:300;display:none;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px;flex-direction:column;gap:14px;letter-spacing:.06em}
.loading.on{display:flex}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--amber);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ask-bg{position:fixed;inset:0;background:rgba(34,49,63,.5);z-index:250;display:none;align-items:center;justify-content:center;padding:16px}
.ask-bg.on{display:flex}
.ask{background:#fff;border-radius:20px;padding:24px 20px 18px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(34,49,63,.3);animation:up .18s ease-out}
.ask-msg{font-size:17px;line-height:1.65;white-space:pre-line;margin-bottom:20px;color:var(--ink)}
.ask-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-danger-solid{background:var(--red);color:#fff}
.share-img{width:100%;max-height:60vh;object-fit:contain;object-position:top;background:#fff;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:14px;box-shadow:var(--shadow)}
.share-steps{display:grid;gap:10px}
a.btn{text-decoration:none}
.sync{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--ink-2);background:var(--pale);border-radius:12px;padding:10px 12px;margin-top:12px}
.sync.on{background:var(--green-pale);color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <nav class="bnav" id="bnav">
    <button data-act="go" data-to="#/home" data-nav="home"></button>
    <button data-act="go" data-to="#/schedule" data-nav="schedule"></button>
    <button data-act="go" data-to="#/clients" data-nav="clients"></button>
    <button data-act="go" data-to="#/library" data-nav="library"></button>
    <button data-act="go" data-to="#/settings" data-nav="settings"></button>
  </nav>
</div>
<div class="bs-bg" id="bsBg"><div class="bs" role="dialog"><div class="bs-head"><b id="bsTitle"></b><button class="tb-btn" data-act="bsClose" aria-label="關閉"></button></div><div class="bs-body" id="bsBody"></div></div></div>

/* =========================================================
   計算
   ========================================================= */
function calc(q) {
  const sub = q.items.reduce((s, it) => s + num(it.qty) * num(it.price), 0);
  const disc = Math.max(0, num(q.discount));
  const base = Math.max(0, sub - disc);
  const tax = q.tax ? Math.round(base * 0.05) : 0;
  const total = Math.round(base + tax);
  const p = q.pay || {};
  const pd = num(p.dep), pm = num(p.mid), pf = num(p.fin);
  const pctSum = pd + pm + pf;
  const dep = Math.round(total * pd / 100);
  const mid = Math.round(total * pm / 100);
  const fin = Math.abs(pctSum - 100) < 0.001 ? total - dep - mid : Math.round(total * pf / 100);
  return { sub, disc, tax, total, dep, mid, fin, pctSum };
}
function cnMoney(n) {
  n = Math.round(n);
  if (n <= 0) return '新台幣 零元整';
  const D = '零壹貳參肆伍陸柒捌玖', U = ['仟','佰','拾',''], G = ['','萬','億','兆'];
  const grp = g => {
    const d = [Math.floor(g / 1000), Math.floor(g / 100) % 10, Math.floor(g / 10) % 10, g % 10];
    let s = '', zero = false, started = false;
    d.forEach((x, i) => { if (x === 0) { if (started) zero = true; } else { if (zero) s += '零'; zero = false; s += D[x] + U[i]; started = true; } });
    return s;
  };
  const groups = []; while (n > 0) { groups.unshift(n % 10000); n = Math.floor(n / 10000); }
  let out = '', pend = false;
  groups.forEach((g, i) => {
    const unit = G[groups.length - 1 - i];
    if (g === 0) { if (out) pend = true; return; }
    if (out && (pend || g < 1000)) out += '零';
    out += grp(g) + unit; pend = false;
  });
  return '新台幣 ' + out + '元整';
}
function genNo(dateStr) {
  const prefix = 'QUO-' + dateStr.replace(/-/g, '') + '-';
  let max = 0;
  DB.quotes.forEach(q => { if (q.no && q.no.startsWith(prefix)) max = Math.max(max, parseInt(q.no.slice(prefix.length)) || 0); });
  return prefix + pad(max + 1, 3);
}

/* =========================================================
   收款、追加、成本、客戶 計算
   ========================================================= */
const RANK = { draft: 0, sent: 1, signed: 2, deposit: 3, mid: 4, done: 5 };
const ACTIVE = ['signed', 'deposit', 'mid'];
const STAGE_NAME = { dep: '訂金', mid: '中期款', fin: '尾款', other: '其他款項' };
const PAY_METHODS = ['匯款', '現金', 'LINE Pay', '支票', '其他'];
const WD = '日一二三四五六';
const fmtDay = ds => { const d = new Date(ds + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
function normQ(q) {
  q.items = q.items || []; q.payments = q.payments || []; q.variations = q.variations || [];
  q.mats = q.mats || []; q.due = q.due || {};
  q.pay = q.pay || { dep: 30, mid: 40, fin: 30 }; q.otherCost = num(q.otherCost);
  return q;
}
const approvedVars = q => (q.variations || []).filter(v => v.status === 'approved');
function varCalc(q, v) {
  const sub = (v.items || []).reduce((s, it) => s + num(it.qty) * num(it.price), 0);
  const tax = q.tax ? Math.round(sub * 0.05) : 0;
  return { sub, tax, total: Math.round(sub + tax) };
}
function fin(q) {
  const c = calc(q);
  const add = approvedVars(q).reduce((s, v) => s + varCalc(q, v).total, 0);
  const contract = c.total + add;
  const pays = q.payments || [];
  const paid = pays.reduce((s, p) => s + num(p.amount), 0);
  const stages = [
    { key: 'dep', pct: num(q.pay.dep), amt: c.dep, add: 0 },
    { key: 'mid', pct: num(q.pay.mid), amt: c.mid, add: 0 },
    { key: 'fin', pct: num(q.pay.fin), amt: c.fin + add, add },
  ].filter(s => s.amt > 0);
  const t = today();
  stages.forEach(s => {
    s.name = STAGE_NAME[s.key];
    s.paid = pays.filter(p => p.stage === s.key).reduce((a, p) => a + num(p.amount), 0);
    s.left = Math.max(0, s.amt - s.paid);
    s.due = (q.due || {})[s.key] || '';
    s.overdue = ACTIVE.includes(q.status) && s.left > 0 && !!s.due && s.due < t;
  });
  return { c, add, contract, paid, left: Math.max(0, contract - paid), stages };
}
function receivable(q) { return ACTIVE.includes(q.status) ? fin(q).left : 0; }
function overdueList() {
  const out = [];
  DB.quotes.forEach(q => fin(q).stages.forEach(s => { if (s.overdue) out.push({ q, s }); }));
  return out;
}
function costInfo(q) {
  const vars = approvedVars(q);
  const items = [...q.items, ...vars.flatMap(v => v.items || [])];
  const itemCost = items.reduce((s, it) => s + num(it.qty) * num(it.cost), 0);
  const f = fin(q);
  const tax = f.c.tax + vars.reduce((s, v) => s + varCalc(q, v).tax, 0);
  const revenue = f.contract - tax;
  const cost = itemCost + num(q.otherCost);
  const profit = revenue - cost;
  return { revenue, itemCost, other: num(q.otherCost), cost, profit, margin: revenue ? profit / revenue : 0, missing: items.filter(it => it.name && !num(it.cost)).length };
}
function autoStatus(q) {
  if (!(q.status in RANK)) return null;
  const f = fin(q), st = k => f.stages.find(s => s.key === k);
  let next = q.status;
  if (f.contract > 0 && f.paid >= f.contract) next = 'done';
  else if (st('mid') && st('dep') && f.paid >= st('dep').amt + st('mid').amt) next = 'mid';
  else if (f.paid > 0) next = 'deposit';
  if (RANK[next] > RANK[q.status]) { q.status = next; return next; }
  return null;
}
function genSerial(prefix, list) {
  const pre = prefix + '-' + today().replace(/-/g, '') + '-';
  let max = 0;
  list.forEach(n => { if (n && n.startsWith(pre)) max = Math.max(max, parseInt(n.slice(pre.length)) || 0); });
  return pre + pad(max + 1, 3);
}
const allReceiptNos = () => DB.quotes.flatMap(q => (q.payments || []).map(p => p.no));
function clientKey(q) { const d = String(q.phone || '').replace(/\D/g, ''); return d ? 'p' + d : 'n' + String(q.client || '').trim(); }
function clientList(skipId) {
  const m = new Map();
  DB.quotes.forEach(q => {
    if (q.id === skipId || !String(q.client || '').trim()) return;
    const k = clientKey(q);
    const c = m.get(k) || { key: k, name: q.client, phone: q.phone, address: q.address, quotes: [], last: '' };
    c.quotes.push(q);
    if ((q.date || '') >= c.last) { c.last = q.date || ''; c.name = q.client; c.phone = q.phone || c.phone; c.address = q.address || c.address; }
    m.set(k, c);
  });
  return [...m.values()].map(c => ({
    ...c,
    total: c.quotes.filter(q => RANK[q.status] >= 2).reduce((s, q) => s + fin(q).contract, 0),
    left: c.quotes.reduce((s, q) => s + receivable(q), 0),
  })).sort((a, b) => b.last.localeCompare(a.last));
}

    const bg = $('#askBg'), y = $('#askYes'), n = $('#askNo');

    y.textContent = yes; y.className = 'btn ' + (danger ? 'btn-danger-solid' : 'btn-primary');
    bg.classList.add('on');
    const done = v => { bg.classList.remove('on'); y.onclick = n.onclick = bg.onclick = null; resolve(v); };
    y.onclick = () => done(true); n.onclick = () => done(false);
    bg.onclick = e => { if (e.target === bg) done(false); };
    setTimeout(() => y.focus(), 50);
  });
}

/* =========================================================
   雲端同步（在 claude.ai 開啟且已登入時）
   每位使用者的資料放在自己的私人路徑 data/users/<id>/
   ========================================================= */
const Cloud = { ready: false, snap: {}, timer: null, busy: false, again: false, warned: false };
async function cloudInit() {
  if (!inViewer()) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const base = 'data/users/' + uid;
    Cloud.sRef = db.collection(base).doc('settings');
    Cloud.lRef = db.collection(base).doc('library');
    Cloud.jRef = db.collection(base).doc('jobs');
    Cloud.qCol = db.doc(base + '/quotes').collection('items');
    const [sd, ld, jd, qs] = await Promise.all([Cloud.sRef.get(), Cloud.lRef.get(), Cloud.jRef.get(), Cloud.qCol.get()]);
    let changed = false;
    if (sd.exists) {
      const d = sd.data(); Cloud.snap.s = JSON.stringify(d.settings || {});
      if ((d.updatedAt || 0) > (DB.meta.settingsAt || 0)) { DB.settings = { ...defaultData().settings, ...(d.settings || {}) }; DB.meta.settingsAt = d.updatedAt; changed = true; }
    }
    if (ld.exists) {
      const d = ld.data(); Cloud.snap.l = JSON.stringify(d.library || []);
      if ((d.updatedAt || 0) > (DB.meta.libraryAt || 0) && Array.isArray(d.library)) { DB.library = JSON.parse(JSON.stringify(d.library)); DB.meta.libraryAt = d.updatedAt; changed = true; }
    }
    if (jd.exists) {
      const d = jd.data(); Cloud.snap.j = JSON.stringify(d.jobs || []);
      if ((d.updatedAt || 0) > (DB.meta.jobsAt || 0) && Array.isArray(d.jobs)) { DB.jobs = JSON.parse(JSON.stringify(d.jobs)); DB.meta.jobsAt = d.updatedAt; changed = true; }
    }
    const local = new Map(DB.quotes.map(q => [q.id, q]));
    qs.docs.forEach(doc => {
      const d = doc.data() || {}, id = doc.id;
      if (d.deletedAt) {
        Cloud.snap['q:' + id] = 'DEL';
        const l = local.get(id);
        if (l && (l.updatedAt || 0) <= d.deletedAt) { local.delete(id); changed = true; }
        return;
      }
      if (!d.q) return;
      Cloud.snap['q:' + id] = JSON.stringify(d.q);
      const l = local.get(id);
      if (!l || (d.q.updatedAt || 0) > (l.updatedAt || 0)) { local.set(id, normQ(JSON.parse(JSON.stringify(d.q)))); changed = true; }
    });
    if (changed) {
      DB.quotes = [...local.values()];
      if (cur) cur = DB.quotes.find(q => q.id === cur.id) || null;
      try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
      if (['edit', 'var', 'doc', 'mats'].includes(page)) { if (!cur) nav('#/home'); } else route();
    }
    Cloud.ready = true;
    if (page === 'settings') renderSettings();
    cloudPush();
  } catch (e) { console.warn('cloud', e); }
}
function cloudPush() {
  if (!Cloud.ready) return;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(cloudFlush, 1200);
}
async function cloudFlush() {
  if (Cloud.busy) { Cloud.again = true; return; }
  Cloud.busy = true;
  try {
    const now = Date.now();
    const sj = JSON.stringify(DB.settings);
    if (sj !== Cloud.snap.s) { await Cloud.sRef.set({ settings: JSON.parse(sj), updatedAt: now }); Cloud.snap.s = sj; DB.meta.settingsAt = now; }
    const lj = JSON.stringify(DB.library);
    if (lj !== Cloud.snap.l) { await Cloud.lRef.set({ library: JSON.parse(lj), updatedAt: now }); Cloud.snap.l = lj; DB.meta.libraryAt = now; }
    const jj = JSON.stringify(DB.jobs);
    if (jj !== Cloud.snap.j) { await Cloud.jRef.set({ jobs: JSON.parse(jj), updatedAt: now }); Cloud.snap.j = jj; DB.meta.jobsAt = now; }
    const ids = new Set();
    for (const q of DB.quotes) {
      ids.add(q.id);
      const qj = JSON.stringify(q);
      if (qj !== Cloud.snap['q:' + q.id]) { await Cloud.qCol.doc(q.id).set({ q: JSON.parse(qj), updatedAt: q.updatedAt || now }); Cloud.snap['q:' + q.id] = qj; }
    }
    for (const k of Object.keys(Cloud.snap)) {
      if (!k.startsWith('q:')) continue;
      const id = k.slice(2);
      if (!ids.has(id) && Cloud.snap[k] !== 'DEL') { await Cloud.qCol.doc(id).set({ deletedAt: now }); Cloud.snap[k] = 'DEL'; }
    }
    try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
  } catch (e) {
    console.warn('cloud push', e);
    if (!Cloud.warned) { Cloud.warned = true; toast('雲端同步暫時失敗，資料仍保存在這台裝置', 3500); }
  } finally {
    Cloud.busy = false;
    if (Cloud.again) { Cloud.again = false; cloudPush(); }
  }
}

let page = '', cur = null, step = 1, curPath = '#/home';
let curItems = null, curVar = null, docState = { kind: 'quote', ref: '' };
function nav(path) { curPath = path; route(); }
const listState = { q: '', f: 'all' };
const NAV_PAGES = ['home', 'schedule', 'clients', 'library', 'settings'];
function route() {
  const [, p = 'home', id, a, b] = (curPath || '#/home').slice(1).split('/');
  // 離開編輯頁時，清掉完全空白的新單／追加單
  if (page === 'edit' && cur && p !== 'edit' && !cur.client && cur.items.length === 0) {
    DB.quotes = DB.quotes.filter(x => x.id !== cur.id); save(true);
  }
  if (page === 'var' && cur && curVar && p !== 'var' && !curVar.title && !curVar.items.length) {
    cur.variations = cur.variations.filter(v => v !== curVar); save(true);
  }
  page = p;
  window.scrollTo(0, 0);
  const bn = $('#bnav');
  bn.style.display = NAV_PAGES.includes(p) ? 'flex' : 'none';
  $$('[data-nav]', bn).forEach(x => x.classList.toggle('on', x.dataset.nav === p));
  const q = id ? DB.quotes.find(x => x.id === id) : null;
  if (['case', 'edit', 'var', 'doc', 'preview', 'mats'].includes(p)) {
    if (!q) return nav('#/home');
    cur = normQ(q);
  }
  switch (p) {
    case 'case': return renderCase();
    case 'edit': curVar = null; curItems = q.items; return renderEditor();
    case 'var': {
      const v = q.variations.find(x => x.id === a);
      if (!v) return nav('#/case/' + q.id);
      curVar = v; curItems = v.items; return renderVarEditor();
    }
    case 'preview': docState = { kind: 'quote', ref: '' }; return renderDoc();
    case 'doc': docState = { kind: a || 'quote', ref: b || '' }; return renderDoc();
    case 'mats': return renderMats();
    case 'schedule': return renderSchedule();
    case 'clients': return renderClients();
    case 'library': return renderLibrary();
    case 'settings': return renderSettings();
    default: page = 'home'; return renderHome();
  }
}

const FILTERS = [
  ['all', '全部'], ['draft', '草稿'], ['pending', '待簽約'], ['recv', '收款中'], ['overdue', '逾期'], ['done', '已結案'], ['lost', '未成交'],

function matchFilter(q, f) {
  switch (f) {
    case 'draft': return q.status === 'draft';
    case 'pending': return q.status === 'sent' || q.status === 'draft';
    case 'recv': return ACTIVE.includes(q.status);
    case 'overdue': return fin(q).stages.some(s => s.overdue);
    case 'won': return RANK[q.status] >= 2 && (q.date || '').startsWith(today().slice(0, 7));
    case 'done': return q.status === 'done';
    case 'lost': return q.status === 'lost';
    default: return true;
  }
}

function renderSchedule() {
  const crew = DB.settings.crew || [];
  const t = today(), tm = addDays(t, 1);
  const list = DB.jobs.filter(j => schedCrew === 'all' || (j.crew || []).includes(schedCrew))
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const late = list.filter(j => j.date < t && !j.done);
  const past = list.filter(j => j.date < t && j.done && j.date >= addDays(t, -30)).reverse();
  const upcoming = list.filter(j => j.date >= t);
  const days = {}; upcoming.forEach(j => (days[j.date] ||= []).push(j));
  const dayH = d => `<div class="day-h">${fmtDay(d)}${d === t ? '<span class="today">今天</span>' : d === tm ? '<span class="today tm">明天</span>' : ''}<button data-act="dayCopy" data-d="${d}">${icon('copy')}複製派工</button></div>`;
  $('#view').innerHTML = `

    ${late.length ? `<div class="day-h" style="color:var(--red)">${icon('alert')} 過期未完成 ${late.length} 件</div>${late.map(j => jobCard(j)).join('')}` : ''}
    ${Object.keys(days).length ? Object.entries(days).map(([d, js]) => dayH(d) + js.map(j => jobCard(j)).join('')).join('') : `<div class="empty"><b>接下來沒有排程</b>按上方「＋ 排定施工」安排第一個工作</div>`}
    ${past.length ? `<button class="btn btn-outline btn-block" style="margin-top:16px" data-act="schedPast">${schedPast ? '收起' : '顯示'}最近 30 天已完成（${past.length}）</button>${schedPast ? past.map(j => `<div class="hint" style="margin:10px 0 4px">${fmtDay(j.date)}</div>` + jobCard(j)).join('') : ''}` : ''}

function setStep(n) {
  step = n;
  $$('.step').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  $$('.pane').forEach(p => p.classList.toggle('on', +p.dataset.pane === n));
  window.scrollTo(0, 0);
}
function renderItems() {
  const box = $('#items'); if (!box) return;
  const items = curItems || [];
  if (!items.length) {
    box.innerHTML = `<div class="empty" style="padding:24px 10px 16px"><b>尚未加入工料項目</b>點下方按鈕，從常用工料庫一鍵帶入</div>`;
  } else {
    box.innerHTML = items.map((it, i) => `
    <div class="item" data-row="${i}">
      <div class="it-head">
        <div class="it-no">${i + 1}</div>
        <input class="inp" data-i="${i}" data-k="name" value="${esc(it.name)}" placeholder="項目名稱">
        <button class="icon-btn del" data-act="delItem" data-i="${i}" aria-label="刪除">${icon('trash')}</button>
      </div>
      <div class="it-grid">
        <div><span class="lbl">數量</span><div class="stepper"><button data-act="qty" data-i="${i}" data-d="-1">−</button><input type="number" inputmode="decimal" step="any" data-i="${i}" data-k="qty" value="${it.qty}"><button data-act="qty" data-i="${i}" data-d="1">＋</button></div></div>
        <div><span class="lbl">單位</span><input class="inp" data-i="${i}" data-k="unit" value="${esc(it.unit)}" list="unitList"></div>
        <div><span class="lbl">單價</span><input class="inp" type="number" inputmode="numeric" data-i="${i}" data-k="price" value="${it.price}"></div>
      </div>
      <div class="it-foot">
        <label class="mat"><input type="checkbox" data-i="${i}" data-k="material" ${it.material ? 'checked' : ''}><span class="tg"></span><span class="on-t">包含材料</span><span class="off-t">純工資</span></label>
        <div class="it-sub">小計<b data-sub="${i}">${money(num(it.qty) * num(it.price))}</b></div>
      </div>
      <div class="it-cost">成本單價<input type="number" inputmode="numeric" data-i="${i}" data-k="cost" value="${it.cost || ''}" placeholder="0" aria-label="成本單價"><span>/ ${esc(it.unit || '單位')}・只有你看得到</span></div>
      ${it.fromLib ? '' : `<button class="mini-link" data-act="saveToLib" data-i="${i}">☆ 存入常用工料庫</button>`}
    </div>`).join('') + `<datalist id="unitList">${['台','米','坪','處','式','組','座','盞','迴','次','工','車','樘','只','片','才','尺'].map(u => `<option value="${u}">`).join('')}</datalist>`;
  }
  const c = $('#itemCnt'); if (c) c.textContent = items.length ? items.length : '';
}
function updateTotals() {
  const q = cur; if (!q) return;
  const set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
  (curItems || []).forEach((it, i) => { const el = $(`[data-sub="${i}"]`); if (el) el.textContent = money(num(it.qty) * num(it.price)); });
  if (page === 'var' && curVar) { set('barTotal', money(varCalc(q, curVar).total)); return; }
  const c = calc(q);
  set('barTotal', money(c.total));
  set('amtDep', money(c.dep)); set('amtMid', money(c.mid)); set('amtFin', money(c.fin));
  set('pctSum', c.pctSum + '%'); set('payTotal', money(c.total));
  set('validTo', fmtDate(addDays(q.date || today(), num(q.validDays))));
  set('sumHint', `項目合計 ${money(c.sub)}${c.disc ? `　折讓 −${money(c.disc)}` : ''}${c.tax ? `　稅金 +${money(c.tax)}` : ''}　＝ 總金額 ${money(c.total)}`);
  const w = $('#payWarn'); if (w) w.innerHTML = Math.abs(c.pctSum - 100) > 0.001 ? `<div class="warn">⚠ 付款比例合計為 ${c.pctSum}%，應為 100%</div>` : '';
}
function touch() { cur.updatedAt = Date.now(); const t = $('#savedTag'); if (t) t.textContent = '儲存中…'; updateTotals(); save(); }
function setPath(o, path, v) { const k = path.split('.'); let x = o; while (k.length > 1) x = x[k.shift()]; x[k[0]] = v; }

const NUM_FIELDS = ['discount', 'days', 'validDays', 'pay.dep', 'pay.mid', 'pay.fin'];
document.addEventListener('input', e => {
  const el = e.target;
  if (!['edit', 'var'].includes(page) || !cur) return;
  if (el.dataset.f && page === 'edit') {
    const f = el.dataset.f;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (NUM_FIELDS.includes(f)) v = num(v);
    setPath(cur, f, v);
    if (f.startsWith('pay.')) $$('[data-act="payPreset"]').forEach(b => b.classList.toggle('on', b.dataset.p === `${cur.pay.dep},${cur.pay.mid},${cur.pay.fin}`));
    if (f === 'warranty') $$('[data-act="warranty"]').forEach(b => b.classList.toggle('on', b.dataset.w === v));
    if (f === 'client') renderClientSug(v);
    touch();
  } else if (el.dataset.vf && page === 'var' && curVar) {
    curVar[el.dataset.vf] = el.value; touch();
  } else if (el.dataset.k && el.dataset.i !== undefined && curItems) {
    const it = curItems[+el.dataset.i]; if (!it) return;
    const k = el.dataset.k;
    it[k] = el.type === 'checkbox' ? el.checked : ['qty', 'price', 'cost'].includes(k) ? num(el.value) : el.value;
    touch();
  }
});
document.addEventListener('change', e => { if (e.target.type === 'checkbox') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
// 案件頁：應收日、其他成本
document.addEventListener('change', e => {
  const el = e.target;
  if (page !== 'case' || !cur) return;
  if (el.dataset.due) { cur.due[el.dataset.due] = el.value; }
  else if (el.dataset.oc) { cur.otherCost = num(el.value); }
  else return;
  cur.updatedAt = Date.now(); save(true); renderCase();
});
// 叫料頁
document.addEventListener('input', e => {
  const el = e.target;
  if (page !== 'mats' || !cur) return;
  if (el.dataset.mf) cur[el.dataset.mf] = el.value;
  else if (el.dataset.mk) { const m = cur.mats[+el.dataset.mi]; if (!m) return; m[el.dataset.mk] = el.dataset.mk === 'qty' ? num(el.value) : el.value; }
  else return;
  cur.updatedAt = Date.now(); save();
  const a = $('a.btn-line'); if (a) a.href = 'https://line.me/R/share?text=' + encodeURIComponent(matText(cur));
});
function refreshJobs() {
  if (page === 'schedule') renderSchedule();
  else if (page === 'case') renderCase();
  else if (page === 'home') renderHome();
}

function openPicker(filterCat = 'all', kw = '') {
  const cats = [...new Set(DB.library.map(x => x.cat || '其他'))];
  const k = kw.trim().toLowerCase();
  const list = DB.library.filter(x => (filterCat === 'all' || (x.cat || '其他') === filterCat) && (!k || x.name.toLowerCase().includes(k)));
  const groups = {};
  list.forEach(x => (groups[x.cat || '其他'] ||= []).push(x));
  const body = `
    <div class="search" style="margin-top:0">${icon('search')}<input type="search" id="pkSearch" placeholder="搜尋品項" value="${esc(kw)}"></div>
    <div class="chips">${['all', ...cats].map(c => `<button class="chip ${filterCat === c ? 'on' : ''}" data-act="pkCat" data-c="${esc(c)}">${c === 'all' ? '全部' : esc(c)}</button>`).join('')}</div>
    <div id="pkList">${Object.keys(groups).length ? Object.entries(groups).map(([c, arr]) => `<div class="cat-h">${esc(c)}</div>` + arr.map(x => `
      <button class="pick" data-act="pick" data-id="${x.id}">
        <span class="nm">${esc(x.name)}<small class="ltag ${x.material ? 'm' : 'l'}">${x.material ? '✓ 含料' : '純工資'}</small></span>
        <span class="pr">${money(x.price)}<small>/ ${esc(x.unit)}</small></span>
        <span class="plus">${icon('plus')}</span>
      </button>`).join('')).join('') : '<div class="empty">沒有符合的品項</div>'}</div>
    <button class="btn btn-outline btn-block" style="margin-top:8px" data-act="addBlank">${icon('edit')}找不到？新增自訂項目</button>`;
  if ($('#bsBg').classList.contains('on') && $('#pkSearch')) {
    $('#bsBody').innerHTML = body;
  } else openSheet('點選常用工料', body);
  const s = $('#pkSearch');
  s.dataset.cat = filterCat;
  s.addEventListener('input', () => { const pos = s.value; openPicker(filterCat, pos); const n = $('#pkSearch'); n.focus(); n.setSelectionRange(pos.length, pos.length); });
}
function addItem(it) {
  curItems.push({ id: uid(), qty: 1, ...it });
  touch(); renderItems();
  const i = curItems.length - 1;
  const row = $(`[data-row="${i}"]`);
  if (row) {
    row.classList.add('flash');
    row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const qi = $(`[data-i="${i}"][data-k="${it.name ? 'qty' : 'name'}"]`);
    if (qi) setTimeout(() => { qi.focus(); qi.select && qi.select(); }, 250);
  }
}

const DOC_NAME = { quote: '報價單', invoice: '請款單', receipt: '收據', var: '追加工程單' };
function docHTML() {

function docNo() {

function docAmount() {

  if (kind === 'var') { const v = q.variations.find(x => x.id === ref); return v ? varCalc(q, v).total : 0; }

}
function renderDoc() {

function fitPaper() {
  const wrap = $('#paperWrap'), sc = $('#paperScale'); if (!wrap || !sc) return;
  const avail = Math.min(794, $('#view .wrap').clientWidth - 32);
  const k = avail / 794;
  sc.style.transform = `scale(${k})`;
  wrap.style.width = avail + 'px';
  wrap.style.height = sc.firstElementChild.offsetHeight * k + 'px';
}
window.addEventListener('resize', () => { if (page === 'preview') fitPaper(); });

const cacheKey = () => JSON.stringify([docState, cur, DB.settings]);
async function getRender() {
  const key = cacheKey();
  if (renderCache.key === key && renderCache.canvas) return renderCache;
  if (!window.html2canvas) throw new Error('nolib');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-10000px;top:0;width:794px;background:#fff;';
  host.innerHTML = docHTML();
  document.body.appendChild(host);
  const el = host.firstElementChild;
  // 分頁切點：每個 .pb 元素的上緣（避免把一列切成兩半）
  const top0 = el.getBoundingClientRect().top;
  const breaks = $$('.pb', el).map(n => n.getBoundingClientRect().top - top0).filter(v => v > 0);
  const h = el.offsetHeight;
  try {
    const canvas = await html2canvas(el, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 1000, scrollX: 0, scrollY: 0 });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    renderCache = { key, canvas, blob, breaks, h };
    return renderCache;
  } finally { host.remove(); }
}
const fileBase = () => `${DOC_NAME[docState.kind]}_${docNo()}_${(cur.client || '客戶').replace(/[\\/:*?"<>|\s]/g, '')}`;
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// 在 claude.ai 上用「downloads」功能存檔；單獨開檔時用一般下載
let DL = null;
const inViewer = () => !!(window.claude && window.claude.use);
async function saveFile(blob, name) {
  if (inViewer()) {
    if (!DL) { try { DL = await window.claude.use('downloads'); } catch (e) { DL = null; } }
    if (!DL) return 'unavailable';
    try { await DL.save({ filename: name, data: blob }); return 'saved'; }
    catch (e) {
      if (e && e.code === 'declined') return 'declined';
      if (e && e.code === 'rate_limited') { toast('上一個存檔視窗還開著，請稍候再試'); return 'declined'; }
      return 'unavailable';
    }
  }
  downloadBlob(blob, name); return 'saved';
}

async function savePdf() {
  const r = await withRender('產生 PDF 中…'); if (!r) return;
  if (!window.jspdf) { toast('PDF 元件載入失敗，請確認網路後重新整理頁面', 3500); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const PW = 210, PH = 297, M = 12;              // mm
  const pxPerMm = 794 / PW;                     // css px / mm
  const k = r.canvas.width / 794;               // canvas px / css px
  let y = 0, first = true;
  while (y < r.h - 2) {
    const topM = first ? 0 : M;
    const avail = (PH - topM - M) * pxPerMm;
    let end = y + avail;
    if (end < r.h) {
      const cands = r.breaks.filter(b => b > y + 80 && b <= end);
      if (cands.length) end = Math.max(...cands);
    } else end = r.h;
    const slice = document.createElement('canvas');
    slice.width = r.canvas.width; slice.height = Math.ceil((end - y) * k);
    const ctx = slice.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, slice.width, slice.height);
    ctx.drawImage(r.canvas, 0, Math.floor(y * k), slice.width, slice.height, 0, 0, slice.width, slice.height);
    if (!first) pdf.addPage();
    pdf.addImage(slice.toDataURL('image/jpeg', 0.93), 'JPEG', 0, topM, PW, (end - y) / pxPerMm);
    y = end; first = false;
  }
  const res = await saveFile(pdf.output('blob'), fileBase() + '.pdf');
  if (res === 'saved') toast('PDF 已儲存');
  else if (res === 'unavailable') toast('這裡無法下載 PDF，請改用「儲存圖片」', 3500);
}

  payAdd: a => payEditor(a.dataset.s),
  payStagePick: a => {
    $$('[data-act="payStagePick"]').forEach(b => b.classList.toggle('on', b === a));
    $('#pyStage').value = a.dataset.k;
    if (num(a.dataset.left)) $('#pyAmt').value = a.dataset.left;
  },
  paySave: async () => {
    const amt = num($('#pyAmt').value); if (amt <= 0) return toast('請輸入收款金額');
    const q = cur;
    const p = { id: uid(), no: genSerial('RCP', allReceiptNos()), stage: $('#pyStage').value, amount: amt, date: $('#pyDate').value || today(), method: $('#pyMethod').value, note: $('#pyNote').value.trim() };
    q.payments.push(p);
    const ns = autoStatus(q);
    q.updatedAt = Date.now(); save(true); closeSheet(); renderCase();
    if (await ask(`已記錄收款 ${money(amt)}${ns ? `\n狀態已改為「${STATUS[ns].t}」` : ''}\n\n要開立收據給客戶嗎？`, { yes: '開收據' })) nav(`#/doc/${q.id}/receipt/${p.id}`);
  },
  payDel: async a => {
    if (!await ask('刪除這筆收款紀錄？\n對應的收據也會一起消失。', { yes: '刪除', danger: true })) return;
    cur.payments = cur.payments.filter(p => p.id !== a.dataset.pid); cur.updatedAt = Date.now(); save(true); renderCase(); toast('已刪除收款紀錄');
  },
  varNew: () => {
    const q = cur;
    const n = Math.max(0, ...q.variations.map(v => parseInt(String(v.no).split('-A').pop()) || 0)) + 1;
    const v = { id: uid(), no: `${q.no}-A${n}`, date: today(), title: '', items: [], note: '', status: 'pending' };
    q.variations.push(v); q.updatedAt = Date.now(); save(true);
    nav(`#/var/${q.id}/${v.id}`);
  },
  varApprove: a => {
    const v = cur.variations.find(x => x.id === a.dataset.v); if (!v) return;
    v.status = v.status === 'approved' ? 'pending' : 'approved';
    cur.updatedAt = Date.now(); save(true); renderCase();
    toast(v.status === 'approved' ? `已確認，追加 ${money(varCalc(cur, v).total)} 併入尾款` : '已取消確認');
  },
  varDone: () => {
    const v = curVar;
    if (!String(v.title || '').trim()) { toast('請填寫追加項目說明'); const t = $('[data-vf="title"]'); if (t) t.focus(); return; }
    if (!v.items.length) return toast('請至少加入一個項目');
    save(true); nav(`#/doc/${cur.id}/var/${v.id}`);
  },
  varDel: async () => {
    if (!await ask('刪除這筆追加工程？', { yes: '刪除', danger: true })) return;
    const v = curVar; curVar = null;
    cur.variations = cur.variations.filter(x => x !== v); cur.updatedAt = Date.now(); save(true);
    nav('#/case/' + cur.id); toast('已刪除追加工程');
  },
  matAdd: () => {
    cur.mats.push({ id: uid(), name: '', qty: 1, unit: '', state: '' }); cur.updatedAt = Date.now(); save(true); renderMats();
    const ins = $$('.mname'); if (ins.length) ins[ins.length - 1].focus();
  },
  matFrom: a => {
    const it = [...cur.items, ...approvedVars(cur).flatMap(v => v.items)].find(x => x.id === a.dataset.id); if (!it) return;
    cur.mats.push({ id: uid(), from: it.id, name: it.name, qty: num(it.qty), unit: it.unit, state: '' });
    cur.updatedAt = Date.now(); save(true); renderMats(); toast('已加入，可改成實際的材料規格與數量');
  },
  matState: a => {
    const m = cur.mats[+a.dataset.i]; if (!m) return;
    m.state = !m.state ? 'ordered' : m.state === 'ordered' ? 'arrived' : '';
    cur.updatedAt = Date.now(); save(true);
    a.className = 'mst ' + m.state; a.textContent = MST[m.state];
  },
  matDel: a => { cur.mats.splice(+a.dataset.i, 1); cur.updatedAt = Date.now(); save(true); renderMats(); },
  matCopy: () => copyText(matText(cur)),
  jobNew: a => jobEditor(null, a.dataset.q || (page === 'case' && cur ? cur.id : '')),
  jobEdit: a => jobEditor(a.dataset.id),
  jobCrew: a => a.classList.toggle('on'),
  jobSave: a => {
    const qid = $('#jbQ').value; if (!qid) return toast('請選擇案件');
    const data = { qid, date: $('#jbDate').value || today(), time: $('#jbTime').value, note: $('#jbNote').value.trim(), crew: $$('#jbCrew .chip.on').map(b => b.dataset.c) };
    if (a.dataset.id) Object.assign(DB.jobs.find(j => j.id === a.dataset.id), data);
    else DB.jobs.push({ id: uid(), done: false, ...data });
    save(true); closeSheet(); refreshJobs(); toast('排程已儲存');
  },
  jobDel: async a => {
    if (!await ask('刪除這個排程？', { yes: '刪除', danger: true })) return;
    DB.jobs = DB.jobs.filter(j => j.id !== a.dataset.id); save(true); closeSheet(); refreshJobs();
  },
  jobDone: a => { const j = DB.jobs.find(x => x.id === a.dataset.id); if (!j) return; j.done = !j.done; save(true); refreshJobs(); },
  dayCopy: a => copyText(dayText(a.dataset.d)),
  schedCrew: a => { schedCrew = a.dataset.c; renderSchedule(); },
  schedPast: () => { schedPast = !schedPast; renderSchedule(); },
  clientOpen: a => clientSheet(a.dataset.k),
  clientNew: a => {
    const c = clientList().find(x => x.key === a.dataset.k); closeSheet();
    newQuote(c ? { client: c.name, phone: c.phone, address: c.address } : {});
  },
  sugPick: a => {
    const c = clientList(cur.id).find(x => x.key === a.dataset.k); if (!c) return;
    Object.assign(cur, { client: c.name, phone: c.phone || '', address: c.address || '' });
    ['client', 'phone', 'address'].forEach(k => { const el = $(`[data-f="${k}"]`); if (el) el.value = cur[k]; });
    $('#clientSug').innerHTML = ''; touch(); toast('已帶入舊客戶資料');
  },

  step: a => setStep(+a.dataset.n),
  picker: () => openPicker(),
  pkCat: a => openPicker(a.dataset.c, ($('#pkSearch') || {}).value || ''),
  pick: a => {
    const x = DB.library.find(l => l.id === a.dataset.id); if (!x) return;
    closeSheet();
    addItem({ name: x.name, unit: x.unit, price: num(x.price), cost: num(x.cost), material: !!x.material, fromLib: true });
    toast(`已加入「${x.name}」，請輸入數量`);
  },
  addBlank: () => { closeSheet(); addItem({ name: '', unit: '式', price: 0, material: true }); },
  delItem: async a => {
    const i = +a.dataset.i, it = curItems[i];
    if (it && (it.name || it.price) && !await ask(`刪除「${it.name || '此項目'}」？`, { yes: '刪除', danger: true })) return;
    curItems.splice(i, 1); touch(); renderItems();
  },
  qty: a => {
    const it = curItems[+a.dataset.i]; if (!it) return;
    it.qty = Math.max(0, Math.round((num(it.qty) + +a.dataset.d) * 100) / 100);
    const inp = $(`[data-i="${a.dataset.i}"][data-k="qty"]`); if (inp) inp.value = it.qty;
    touch();
  },
  saveToLib: a => {
    const it = curItems[+a.dataset.i]; if (!it || !it.name) return toast('請先填寫項目名稱');
    DB.library.push({ id: uid(), cat: '自訂', name: it.name, unit: it.unit || '式', price: num(it.price), cost: num(it.cost), material: !!it.material });
    it.fromLib = true; touch(); renderItems(); toast('已存入常用工料庫（分類：自訂）');
  },
  payPreset: a => {
    const [d, m, f] = a.dataset.p.split(',').map(Number);
    cur.pay = { dep: d, mid: m, fin: f };
    $('[data-f="pay.dep"]').value = d; $('[data-f="pay.mid"]').value = m; $('[data-f="pay.fin"]').value = f;
    $$('[data-act="payPreset"]').forEach(b => b.classList.toggle('on', b === a));
    touch();
  },
  warranty: a => {
    cur.warranty = a.dataset.w; $('[data-f="warranty"]').value = a.dataset.w;
    $$('[data-act="warranty"]').forEach(b => b.classList.toggle('on', b === a)); touch();
  },
  days: a => { cur.days = Math.max(0, num(cur.days) + +a.dataset.d); $('[data-f="days"]').value = cur.days; touch(); },
  generate: async () => {
    const q = cur, c = calc(q);
    if (!q.client.trim()) { setStep(1); toast('請先填寫客戶姓名'); setTimeout(() => $('[data-f="client"]').focus(), 200); return; }
    if (!q.items.length) { setStep(2); toast('請至少加入一個工料項目'); return; }
    if (Math.abs(c.pctSum - 100) > 0.001 && !await ask(`付款比例合計為 ${c.pctSum}%（不是 100%），仍要生成報價單嗎？`, { yes: '仍要生成' })) { setStep(3); return; }
    save(true);
    nav('#/doc/' + q.id + '/quote');
  },
  saveImg: () => saveImage(),
  savePdf: () => savePdf(),
  shareLine: () => shareLine(),
  libCat: a => { libCat = a.dataset.c; renderLibrary(); },
  libEdit: a => libEditor(a.dataset.id),
  lbCatPick: a => { $('#lbCat').value = a.dataset.c; },
  libSave: a => {
    const name = $('#lbName').value.trim(), price = num($('#lbPrice').value);
    if (!name) return toast('請填寫項目名稱');
    const data = { cat: $('#lbCat').value.trim() || '其他', name, price, unit: $('#lbUnit').value.trim() || '式', material: $('#lbMat').checked, cost: num($('#lbCost').value) };
    if (a.dataset.id) Object.assign(DB.library.find(l => l.id === a.dataset.id), data);
    else DB.library.push({ id: uid(), ...data });
    save(true); closeSheet(); renderLibrary(); toast('已儲存');
  },
  libDel: async a => {
    if (!await ask('確定刪除這個常用項目？\n已開立的報價單不受影響。', { yes: '刪除', danger: true })) return;
    DB.library = DB.library.filter(l => l.id !== a.dataset.id); save(true); closeSheet(); renderLibrary(); toast('已刪除');
  },
  logoPick: () => $('#fileLogo').click(),
  logoClear: () => { DB.settings.logo = ''; save(true); renderSettings(); },
  resetTerms: () => { DB.settings.terms = DEFAULT_TERMS; save(true); renderSettings(); toast('已恢復預設條款'); },
  exportBackup: () => exportBackup(),
  importBackup: () => $('#fileImport').click(),
  resetAll: async () => {
    if (!await ask('確定清除「全部」報價單、工料庫與設定？\n建議先匯出備份。此動作無法復原。', { yes: '清除', danger: true })) return;
    if (!await ask('再次確認：真的要清除全部資料嗎？', { yes: '全部清除', danger: true })) return;
    DB = defaultData(); save(true); nav('#/home'); toast('已清除，恢復初始狀態');
  },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.tagName !== 'A') e.preventDefault();
  fn(a, e);
});
// 數字欄位點擊時全選，方便直接改數字
document.addEventListener('focusin', e => { const el = e.target; if (el.type === 'number') setTimeout(() => el.select && el.select(), 0); });

route();
cloudInit();
</script>
</body>
</html>
